<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shipping Directory</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  body {
    font-family: Arial, sans-serif;
    background: #faf8ff;
    margin: 0;
    padding: 20px;
    color: #333;
  }

  h1 {
    text-align: center;
    margin-bottom: 10px;
  }

  #counter {
    text-align: center;
    margin-bottom: 20px;
    font-size: 1.1rem;
  }

  .search-box {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
  }
  .search-box input {
    width: 90%;
    max-width: 400px;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 12px;
    font-size: 1rem;
  }

  /* Category Button Row */
  .filters {
    text-align: center;
    margin-bottom: 20px;
  }
  .filters button {
    margin: 5px;
    padding: 8px 14px;
    border-radius: 16px;
    border: none;
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(6px);
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    cursor: pointer;
    transition: 0.2s;
  }
  .filters button.active {
    box-shadow: 0 0 0 2px #555 inset;
    font-weight: bold;
  }
  .filters button:hover {
    transform: scale(1.05);
  }

  /* Fandom sections */
  details {
    background: rgba(255,255,255,0.5);
    padding: 10px 14px;
    margin-bottom: 10px;
    border-radius: 14px;
  }

  summary {
    cursor: pointer;
    font-size: 1.1rem;
    font-weight: bold;
  }

  .ship {
    margin-left: 10px;
    padding: 6px 10px;
    border-radius: 10px;
    display: inline-block;
    margin-bottom: 6px;
    font-size: 0.95rem;
  }

  /* CATEGORY COLORS */
  .femslash { background: #e6ccff; } /* violet */
  .slash { background: #ccffcc; }     /* green */
  .het { background: #ffcccc; }       /* red */
  .nb { background: #ffd9a6; }        /* orange */
  .multi { background: #c9f4f6; }     /* teal */

</style>
</head>
<body>

<h1>Shipping Directory</h1>
<div id="counter">Loading ships…</div>

<div class="search-box">
  <input id="search" type="text" placeholder="Search ships or fandoms…">
</div>

<div class="filters">
  <button data-filter="all" class="active">All</button>
  <button data-filter="femslash">Femslash</button>
  <button data-filter="slash">Slash</button>
  <button data-filter="het">Het</button>
  <button data-filter="nb">NB</button>
  <button data-filter="multi">Multi</button>
</div>

<div id="directory"></div>

<script>
let DATA = {};
let currentFilter = "all";
let searchTerm = "";

async function loadShips() {
  const response = await fetch("ships.json");
  DATA = await response.json();
  render();
}

function render() {
  let directory = document.getElementById("directory");
  directory.innerHTML = "";
  
  let totalShips = 0;
  let filteredShips = 0;

  const searchLower = searchTerm.toLowerCase();

  for (const fandom of Object.keys(DATA).sort()) {
    const ships = DATA[fandom];

    let fandomContainer = document.createElement("details");
    let summary = document.createElement("summary");
    summary.textContent = fandom;
    fandomContainer.appendChild(summary);

    let showFandom = false;

    ships.forEach(item => {
      const shipName = item.ship;
      const category = item.category || "het"; // default fallback

      const matchesFilter =
        currentFilter === "all" || category === currentFilter;

      const matchesSearch =
        shipName.toLowerCase().includes(searchLower) ||
        fandom.toLowerCase().includes(searchLower);

      totalShips++;

      if (matchesFilter && matchesSearch) {
        filteredShips++;
        showFandom = true;

        let div = document.createElement("div");
        div.className = "ship " + category;
        div.textContent = shipName;
        fandomContainer.appendChild(div);
      }
    });

    // Always show fandom headings (Option 2)
    if (showFandom || searchTerm === "") {
      directory.appendChild(fandomContainer);
    }
  }

  document.getElementById("counter").textContent =
    `Total ships: ${totalShips} | Showing: ${filteredShips}`;
}

/* Search handler */
document.getElementById("search").addEventListener("input", e => {
  searchTerm = e.target.value;
  render();
});

/* Category buttons */
document.querySelectorAll(".filters button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filters button").forEach(b =>
      b.classList.remove("active")
    );
    btn.classList.add("active");
    currentFilter = btn.dataset.filter;
    render();
  });
});

loadShips();
</script>

</body>
</html>
